[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-affect"
version = "0.1.0"
description = "Session-scoped affective state for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Darius Emanuel Ciuverca" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.entry-points."hermes_agent.plugins"]
hermes-affect = "hermes_affect.plugin:register"

[tool.setuptools.packages.find]
include = ["hermes_affect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
